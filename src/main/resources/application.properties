spring.application.name=productos-cache

# Conexion a SQL Server
spring.datasource.url=jdbc:sqlserver://MSI:1433;databaseName=SistemaProductosCache;encrypt=true;trustServerCertificate=true

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8080


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Configuracion de cache
spring.cache.type=caffeine
spring.cache.cache-names=productos

spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# Desactivar Open Session in View
spring.jpa.open-in-view=false
